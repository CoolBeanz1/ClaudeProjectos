<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<meta name="description" content="J.A.R.V.I.S. - your personal offline AI assistant" />
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/icon.svg" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div id="backdrop" class="backdrop"></div>

<div class="app">

  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <div class="brand">
        <span class="brand-ring"></span>
        <span class="brand-text">J.A.R.V.I.S.</span>
      </div>
      <button id="closeDrawer" class="icon-btn drawer-close" aria-label="Close menu">&times;</button>
    </div>

    <button id="newConvoBtn" class="btn-primary btn-touch">
      <span class="plus">+</span> New Conversation
    </button>

    <nav id="convoList" class="convo-list" aria-label="Conversations"></nav>

    <div class="drawer-foot">
      <div class="readout">
        <span class="readout-label">MODEL</span>
        <span id="modelName" class="readout-value">—</span>
      </div>
      <div class="readout">
        <span class="readout-label">LINK</span>
        <span id="linkStatus" class="readout-value status-pending">CHECKING</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="openDrawer" class="icon-btn menu-btn" aria-label="Open menu">
        <span class="hamburger"></span>
      </button>

      <div class="reactor" id="reactor" aria-hidden="true">
        <span class="ring ring-outer"></span>
        <span class="ring ring-mid"></span>
        <span class="core"></span>
      </div>

      <div class="topbar-info">
        <div class="title-line">J.A.R.V.I.S.</div>
        <div id="convoTitle" class="subtitle-line">Just A Rather Very Intelligent System</div>
      </div>

      <div class="clock-wrap">
        <div id="clock" class="clock">--:--</div>
        <div id="dateLine" class="date-line">----</div>
      </div>
    </header>

    <section id="messages" class="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-reactor">
          <span class="ring ring-outer"></span>
          <span class="ring ring-mid"></span>
          <span class="core"></span>
        </div>
        <p class="empty-title">SYSTEMS ONLINE</p>
        <p class="empty-sub">Start a conversation below, sir.</p>
      </div>
    </section>

    <form id="composer" class="composer">
      <textarea
        id="input"
        class="composer-input"
        placeholder="Talk to Jarvis..."
        rows="1"
        autocomplete="off"
        autocapitalize="sentences"
      ></textarea>
      <button type="submit" id="sendBtn" class="send-btn btn-touch" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 12l16-8-6 8 6 8-16-8z" stroke-linejoin="round" stroke-linecap="round" />
        </svg>
      </button>
    </form>
  </main>

</div>

<script src="/app.js"></script>
</body>
</html>
